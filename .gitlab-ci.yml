image: debian:stable

stages: [lint, test]

variables:
  GIT_DEPTH: "20"

.python:
  before_script:
    - apt-get update && apt-get install -y python3

shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine:stable
  script:
    - find openwrt -name '*.sh' -exec shellcheck -S warning {} \; || true

python-syntax:
  stage: lint
  extends: .python
  script:
    - python3 -c "import ast,glob,sys; [ast.parse(open(f,encoding='utf-8').read(), f) for f in glob.glob('**/*.py', recursive=True)]"
    - for f in $(find . -name '*.js' -not -path './third-party/*'); do node --check "$f"; done

shell-syntax:
  stage: lint
  extends: .python
  script:
    - for f in $(find openwrt -name '*.sh'); do sh -n "$f"; done
    # 设备配置不该入库
    - test ! -e openwrt/conf/device.conf

docs:
  stage: test
  extends: .python
  script:
    - python3 tools/check-docs.py

secret-scan:
  stage: test
  extends: .python
  script:
    # 凭据不该出现在仓里
    - |
      if grep -rInE 'oc_sk_[A-Za-z0-9]{6,}|password *= *"[^"]{4,}|SECRET *= *"[0-9a-f]{16,}"' \
           --exclude-dir=.git --exclude-dir=third-party . ; then
        echo "发现疑似明文凭据，提交被拦下"; exit 1
      fi
